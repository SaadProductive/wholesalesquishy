<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmed | Wholesale Squishy</title>
<meta name="description" content="Your Wholesale Squishy order is confirmed. A receipt has been sent to your email.">
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="js/analytics.js"></script>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M5HRM57B" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<nav class="nav">
  <a href="/" class="nav-brand"><img src="images/logo-mark.svg" alt="Wholesale Squishy logo"><span>Wholesale Squishy</span></a>
  </nav>

<main>

  <div class="wrap" style="max-width:640px;padding:clamp(60px,10vw,100px) clamp(20px,6vw,64px);text-align:center;">
    <div style="width:64px;height:64px;border-radius:999px;background:var(--sage-tint);display:flex;align-items:center;justify-content:center;margin:0 auto 24px auto;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3 12L9 18L21 6" stroke="#3D6B40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
            <h1 class="display" style="font-size:28px;font-weight:700;margin:0 0 10px 0;">Order confirmed</h1>
              <p style="font-size:15px;color:var(--ink-soft);line-height:1.6;">Thanks for your order! Stripe has emailed you a receipt, and we'll send tracking once it ships.</p>
                <a href="/" class="btn btn-primary" style="margin-top:20px;">Back to Shop</a>
                </div>

                </main>

<footer class="footer">
                  <div class="footer-bottom" style="text-align:center;padding-top:0;border-top:none;">© 2026 Wholesale Squishy. All rights reserved.</div>
                  </footer>

                  <script src="js/pricing.js"></script>
<script src="js/cart.js"></script>
                  <script>
                  document.addEventListener('DOMContentLoaded', () => {
                    try {
                      const sid = new URLSearchParams(location.search).get('session_id');
                      const order = JSON.parse(sessionStorage.getItem('wsq_last_order') || 'null');
                      const done = localStorage.getItem('wsq_tracked_' + sid);
                      if (sid && order && !done && window.wsqTrack) {
                        wsqTrack('purchase', { ecommerce: { transaction_id: sid, currency: wsqCurrency, value: order.value, shipping: order.shipping, items: order.items } });
                        localStorage.setItem('wsq_tracked_' + sid, '1');
                      }
                      sessionStorage.removeItem('wsq_last_order');
                    } catch (e) {}
                    localStorage.removeItem('wsq_cart');
                      updateCartBadge();
                      });
                      </script>
                      </body>
                      </html>
